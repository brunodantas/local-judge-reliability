[project]
name = "local-judge-reliability"
version = "0.0.0"
description = "Replication of open-weight LLM judge reliability, served locally."
requires-python = ">=3.14"
dependencies = ["openai>=1.0.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
